<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Zomato</title>
  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Premium animated background with floating organic shapes -->
  <div class="bg-container">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
  </div>

  <!-- Main Container -->
  <div class="app-container">
    <div class="login-modal-card" id="loginCard">
      
      <!-- Close Button -->
      <button class="close-btn" id="closeModalBtn" aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Back Button (initially hidden, shown in sub-views) -->
      <button class="back-btn" id="backBtn" aria-label="Go back">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
      </button>

      <!-- Slider Container that switches views horizontally -->
      <div class="slider-wrapper" id="sliderWrapper">
        
        <!-- ================= PHONE LOGIN VIEW ================= -->
        <div class="slide-view active-view" id="phoneView">
          <h2 class="form-title">Login</h2>
          
          <form id="phoneLoginForm" onsubmit="event.preventDefault();">
            <!-- Country Selector & Phone Input Combined -->
            <div class="input-group">
              <div class="country-selector" id="countrySelectorBtn" tabindex="0">
                <span class="selected-flag" id="currentFlag">🇮🇳</span>
                <span class="selected-code" id="currentCode">+91</span>
                <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
              </div>
              <div class="vertical-divider"></div>
              <input type="tel" class="phone-input" id="phoneInputField" placeholder="Phone" autocomplete="tel" maxlength="15">
            </div>
            
            <!-- Error message container -->
            <div class="error-text" id="phoneError"></div>

            <!-- OTP Trigger Button -->
            <button type="submit" class="submit-btn primary-btn" id="sendOtpBtn" disabled>
              Send One Time Password
            </button>
          </form>

          <!-- Divider -->
          <div class="divider-text">
            <span>or</span>
          </div>

          <!-- Social Buttons -->
          <div class="social-login-container">
            <button class="social-btn secondary-btn" id="continueWithEmailBtn">
              <!-- Custom Red Envelope SVG -->
              <svg class="social-icon email-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
                <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
              </svg>
              Continue with Email
            </button>

            <button class="social-btn secondary-btn" id="continueWithGoogleBtn">
              <!-- SVG Google 'G' Logo -->
              <svg class="social-icon" viewBox="0 0 24 24" width="24" height="24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.62-.63-1.05-1.4-1.19-2.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              Continue with Google
            </button>
          </div>

          <!-- Footer Link -->
          <div class="form-footer">
            New to Zomato? <a href="#" id="createAccountLink">Create account</a>
          </div>
        </div>

        <!-- ================= OTP VERIFICATION VIEW ================= -->
        <div class="slide-view" id="otpView">
          <h2 class="form-title">OTP Verification</h2>
          <p class="form-subtitle">We have sent a verification code to <span id="displayPhoneNumber" class="highlight-text">+91 00000 00000</span></p>

          <form id="otpForm" onsubmit="event.preventDefault();">
            <!-- 6 Input boxes for digits -->
            <div class="otp-input-container">
              <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 1">
              <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 2">
              <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 3">
              <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 4">
              <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 5">
              <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 6">
            </div>

            <div class="error-text" id="otpError"></div>

            <button type="submit" class="submit-btn primary-btn" id="verifyOtpBtn" disabled>
              Verify & Proceed
            </button>
          </form>

          <!-- Resend code segment -->
          <div class="resend-container">
            Didn't receive OTP? <span class="resend-action disabled" id="resendBtn">Resend in <span id="timerText">30s</span></span>
          </div>
        </div>

        <!-- ================= EMAIL LOGIN VIEW ================= -->
        <div class="slide-view" id="emailView">
          <h2 class="form-title">Login with Email</h2>
          
          <form id="emailLoginForm" onsubmit="event.preventDefault();">
            <!-- Email Input -->
            <div class="form-field">
              <label for="emailInput" class="field-label">Email</label>
              <input type="email" class="standard-input" id="emailInput" placeholder="Enter your email" required>
            </div>
            
            <!-- Password Input -->
            <div class="form-field">
              <div class="password-label-wrapper">
                <label for="passwordInput" class="field-label">Password</label>
                <a href="#" class="forgot-link">Forgot?</a>
              </div>
              <input type="password" class="standard-input" id="passwordInput" placeholder="Enter your password" required>
            </div>

            <div class="error-text" id="emailError"></div>

            <button type="submit" class="submit-btn primary-btn" id="emailSubmitBtn">
              Log in
            </button>
          </form>

          <div class="divider-text">
            <span>or</span>
          </div>

          <div class="social-login-container">
            <button class="social-btn secondary-btn" id="backToPhoneBtn">
              <!-- Dialpad Phone Icon -->
              <svg class="social-icon email-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M1.5 4.5A3 3 0 0 1 4.5 1.5h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.504 1.76l-1.208 1.208a15.908 15.908 0 0 0 6.6 6.6l1.208-1.208a1.875 1.875 0 0 1 1.76-.504l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" />
              </svg>
              Continue with Phone Number
            </button>
          </div>
        </div>

        <!-- ================= SUCCESS SUCCESS SUCCESS ================= -->
        <div class="slide-view" id="successView">
          <div class="success-illustration">
            <div class="success-circle">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            </div>
          </div>
          <h2 class="success-title">Login Successful!</h2>
          <p class="success-subtitle" id="successSubtitle">Welcome back to Zomato.</p>
          
          <button class="submit-btn primary-btn success-home-btn" id="finishBtn">
            Explore Restaurants
          </button>
        </div>

      </div>

      <!-- ================= COUNTRY SELECTOR DROPDOWN DRAWER ================= -->
      <div class="dropdown-overlay" id="countryDropdown">
        <div class="dropdown-header">
          <h3>Select Country</h3>
          <button class="dropdown-close" id="closeDropdownBtn" aria-label="Close countries list">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        
        <!-- Search bar inside country list -->
        <div class="dropdown-search">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.602 10.602Z" />
          </svg>
          <input type="text" id="countrySearchField" placeholder="Search country name or code...">
        </div>

        <ul class="country-list" id="countryList">
          <!-- Populated by JavaScript -->
        </ul>
      </div>

    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
